<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slack UI Hider</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Slack UI Hider</h1>
      </header>

      <main>
        <div class="settings">
          <h3 class="settings-group-title">Workspace</h3>

          <div class="setting-item">
            <label class="toggle-label">
              <input
                type="checkbox"
                class="toggle-switch"
                data-setting="hideWorkspaceName"
              />
              <span class="toggle-slider"></span>
              <span class="setting-name">Workspace Name</span>
            </label>
          </div>

          <h3 class="settings-group-title">Channels</h3>

          <div class="setting-item">
            <label class="toggle-label">
              <input
                type="checkbox"
                class="toggle-switch"
                data-setting="hidePrivateChannels"
              />
              <span class="toggle-slider"></span>
              <span class="setting-name">Private Channels</span>
            </label>
          </div>

          <div class="setting-item">
            <label class="toggle-label">
              <input
                type="checkbox"
                class="toggle-switch"
                data-setting="hidePublicChannels"
              />
              <span class="toggle-slider"></span>
              <span class="setting-name">Public Channels</span>
            </label>
          </div>

          <div class="setting-item">
            <label class="toggle-label">
              <input
                type="checkbox"
                class="toggle-switch"
                data-setting="hideExternalChannels"
              />
              <span class="toggle-slider"></span>
              <span class="setting-name">External Channels</span>
            </label>
          </div>

          <div class="setting-item">
            <label class="toggle-label">
              <input
                type="checkbox"
                class="toggle-switch"
                data-setting="hideStarredChannels"
              />
              <span class="toggle-slider"></span>
              <span class="setting-name">Starred Channels</span>
            </label>
          </div>

          <h3 class="settings-group-title">Communication</h3>

          <div class="setting-item">
            <label class="toggle-label">
              <input
                type="checkbox"
                class="toggle-switch"
                data-setting="hideDMs"
              />
              <span class="toggle-slider"></span>
              <span class="setting-name">Direct Messages</span>
            </label>
          </div>

          <div class="setting-item">
            <label class="toggle-label">
              <input
                type="checkbox"
                class="toggle-switch"
                data-setting="hideApps"
              />
              <span class="toggle-slider"></span>
              <span class="setting-name">Apps</span>
            </label>
          </div>

          <h3 class="settings-group-title">Content</h3>

          <div class="setting-item">
            <label class="toggle-label">
              <input
                type="checkbox"
                class="toggle-switch"
                data-setting="hideMessages"
              />
              <span class="toggle-slider"></span>
              <span class="setting-name">Messages</span>
            </label>
          </div>

          <div class="setting-item">
            <label class="toggle-label">
              <input
                type="checkbox"
                class="toggle-switch"
                data-setting="hideThreads"
              />
              <span class="toggle-slider"></span>
              <span class="setting-name">Threads</span>
            </label>
          </div>

          <div class="setting-item">
            <label class="toggle-label">
              <input
                type="checkbox"
                class="toggle-switch"
                data-setting="hideReactions"
              />
              <span class="toggle-slider"></span>
              <span class="setting-name">Reactions</span>
            </label>
          </div>

          <div class="setting-item">
            <label class="toggle-label">
              <input
                type="checkbox"
                class="toggle-switch"
                data-setting="hideSenders"
              />
              <span class="toggle-slider"></span>
              <span class="setting-name">Senders</span>
            </label>
          </div>
        </div>

        <div class="actions">
          <div class="hover-setting">
            <label class="toggle-label">
              <input
                type="checkbox"
                class="toggle-switch"
                data-setting="hoverToReveal"
                checked
              />
              <span class="toggle-slider"></span>
              <span class="setting-name">Hover to Reveal</span>
            </label>
          </div>
          <div class="action-buttons">
            <button id="clear-all" class="action-btn">Clear All</button>
            <button id="blur-all" class="action-btn">Blur All</button>
          </div>
        </div>
      </main>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
